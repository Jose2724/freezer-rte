<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f5fbf">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Freezer RTE">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>*{box-sizing:border-box}:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Freezer RTE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one-column phone tool, sticky header, fixed bottom tab bar; carts drawn as pale-blue RTE ID tickets. */
:root{
  --bg:#e9eef2; --surface:#ffffff; --ink:#13202b; --muted:#566775; --line:#cfd9e1;
  --accent:#1f5fbf; --accent-ink:#ffffff; --ticket:#cfe4f2; --ticket-ink:#0e2a45; --ticket-line:#0e2a45;
  --ok:#1b7446; --warn:#b3261e; --amber:#9a5a00; --cell:#f3f6f9; --cell-on:#dbe8fb; --hold:#7b2d9e; --c-code:#0f766e; --c-lot:#4338ca; --c-ccp:#be185d;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c131a; --surface:#15202b; --ink:#e4ecf2; --muted:#8fa1b0; --line:#253441;
  --accent:#6ea3ff; --accent-ink:#0b1622; --ticket:#1a3348; --ticket-ink:#d9ecfb; --ticket-line:#8fb8da;
  --ok:#52c48a; --warn:#ff8a80; --amber:#f0b35a; --cell:#1a2733; --cell-on:#21406a; --hold:#c98ae6; --c-code:#2dd4bf; --c-lot:#a5b4fc; --c-ccp:#f9a8d4; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c131a; --surface:#15202b; --ink:#e4ecf2; --muted:#8fa1b0; --line:#253441;
  --accent:#6ea3ff; --accent-ink:#0b1622; --ticket:#1a3348; --ticket-ink:#d9ecfb; --ticket-line:#8fb8da;
  --ok:#52c48a; --warn:#ff8a80; --amber:#f0b35a; --cell:#1a2733; --cell-on:#21406a; --hold:#c98ae6; --c-code:#2dd4bf; --c-lot:#a5b4fc; --c-ccp:#f9a8d4; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.app{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:12px 10px;border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px}
.brand{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.02em;line-height:1;text-transform:uppercase}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:13px;letter-spacing:0;text-transform:none;color:var(--muted);margin-top:3px}
.sync{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:5px 10px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.ok i{background:var(--ok)} .sync.pend{color:var(--amber)} .sync.pend i{background:var(--amber)}

h2{font-family:var(--f-display);font-weight:700;font-size:24px;text-transform:uppercase;letter-spacing:.03em;margin:20px 0 10px;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:18px;text-transform:uppercase;letter-spacing:.04em;margin:18px 0 8px;color:var(--muted)}
p.hint{color:var(--muted);font-size:14px;margin:6px 0 12px;max-width:62ch}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:15px}
.chip b{font-family:var(--f-mono);font-size:13px;background:var(--cell);border-radius:99px;padding:1px 8px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] b{background:rgba(255,255,255,.22);color:inherit}

/* search */
.search{position:relative;margin-top:14px}
.search input{width:100%;min-height:52px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--surface);padding:0 14px 0 44px;font-size:17px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}

/* freezer map */
.mapwrap{overflow-x:auto;margin-top:10px;padding-bottom:4px}
.map{display:grid;gap:6px;min-width:min-content}
.cell{min-width:64px;min-height:56px;border-radius:8px;border:1.5px dashed var(--line);background:var(--cell);display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:4px 6px;text-align:left}
.cell .lab{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.cell .who{font-family:var(--f-mono);font-weight:600;font-size:13px;line-height:1.2;white-space:nowrap}
.cell.busy{border-style:solid;border-color:var(--ticket-line);background:var(--ticket);color:var(--ticket-ink)}
.cell.busy .lab{color:inherit;opacity:.7}
.cell.sel{outline:3px solid var(--accent);outline-offset:1px;background:var(--cell-on)}
.aisle{grid-column:1/-1;display:flex;align-items:center;justify-content:center;min-height:30px;border-block:2px dashed var(--line);font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
.front{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:2px}
.maplegend{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-top:6px;flex-wrap:wrap}

/* list items */
.list{display:grid;gap:8px;margin-top:12px}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;min-height:64px}
.item .rack{font-family:var(--f-mono);font-weight:600;font-size:20px;background:var(--ticket);color:var(--ticket-ink);border-radius:6px;padding:6px 8px;min-width:78px;text-align:center}
.item .meta{min-width:0}
.item .meta b{font-weight:600}
.k-code{color:var(--c-code)}.k-lot{color:var(--c-lot)}.k-ccp{color:var(--c-ccp)}
.item .meta .k-code{display:block}
.item .meta .k-code,.item .meta .k-lot,.match .k-code,.match .k-lot,.match .k-ccp{white-space:nowrap}
.item .meta small.cc{color:var(--c-ccp);font-size:14px;margin-top:2px;overflow-wrap:anywhere}
.item .meta small.cc b{font-weight:600}
.item .meta small{display:block;color:var(--muted);font-size:13px}
.item .loc{text-align:right;font-size:13px;color:var(--muted);line-height:1.25}
.item .loc b{display:block;font-family:var(--f-mono);font-size:18px;color:var(--ink)}
.item.out{opacity:.7}
.item.out .rack{background:var(--cell);color:var(--muted)}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:4px;padding:1px 5px;background:var(--cell);color:var(--muted);vertical-align:middle}
.tag.hot{background:var(--warn);color:var(--surface)}

.empty{background:var(--surface);border:1.5px dashed var(--line);border-radius:var(--r);padding:22px 18px;margin-top:16px}
.empty h2{margin-top:0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 18px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:16px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{border-color:var(--warn);color:var(--warn)}
.btn.block{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 140px}

/* form */
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.full{grid-column:1/-1}
.f label{font-family:var(--f-display);font-weight:600;font-size:14px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.f input,.f select{min-height:52px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--surface);padding:0 12px;font-size:18px;width:100%;min-width:0}
.f input.big{font-family:var(--f-mono);font-size:22px;font-weight:600}
.f .err{color:var(--warn);font-size:13px;font-weight:600}
.f.bad input{border-color:var(--warn)}
.inline{display:flex;gap:8px}
.inline input{flex:1}
.inline .btn{flex:none;min-height:52px;padding:0 12px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}

/* ticket */
.ticket{background:var(--ticket);color:var(--ticket-ink);border:2px solid var(--ticket-line);border-radius:6px;padding:10px 12px 12px}
.ticket .th{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.08em;text-transform:uppercase;border-bottom:2px solid var(--ticket-line);padding-bottom:4px;margin-bottom:8px;display:flex;justify-content:space-between;gap:8px}
.tg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 12px}
.tg div{min-width:0}
.tg label{display:block;font-family:var(--f-display);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.06em;opacity:.75}
.tg>div>span{font-family:var(--f-mono);font-weight:600;font-size:16px;overflow-wrap:anywhere}
.tg .wide{grid-column:span 2}
.tg .big>span{font-size:24px}
.where{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:14px 0 4px}
.where .fz{font-family:var(--f-display);font-weight:700;font-size:24px;text-transform:uppercase}
.where .sp{font-family:var(--f-mono);font-weight:600;font-size:28px;background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:0 10px}
.part{display:flex;gap:12px;align-items:center;margin:22px 0 12px;padding-top:14px;border-top:1px solid var(--line)}
.part .pn{flex:none;width:32px;height:32px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600}
.part b{display:block;font-family:var(--f-display);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.03em}
.part small{color:var(--muted);font-size:14px}
.lastt{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:12px 0 4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.lastt .deg{font-family:var(--f-mono);font-weight:600;font-size:30px;line-height:1}
.lastt .when{font-size:14px;color:var(--muted)}
.lastt .when b{color:var(--ink)}
.lastt.old .when b{color:var(--amber)}
.tag.ready{background:var(--ok);color:var(--surface)}
.proof{margin:14px 0 4px;background:var(--surface);border:2px solid var(--ok);border-radius:var(--r);padding:10px 12px}
.proof label{display:block;font-family:var(--f-display);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.proof .fz{font-family:var(--f-display);font-weight:700;font-size:24px;text-transform:uppercase;margin-bottom:6px}
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pg span{font-family:var(--f-mono);font-weight:600;font-size:18px}
.hist{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:4px;font-size:14px;color:var(--muted)}
.hist li{display:flex;gap:10px}
.hist .num{min-width:74px}

/* sheet table */
.tablewrap{overflow-x:auto;margin-top:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;font-size:14px;min-width:100%}
th{background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.04em;text-transform:uppercase;padding:8px 10px;text-align:left;white-space:nowrap}
td{padding:8px 10px;border-top:1px solid var(--line);white-space:nowrap;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
td.hot{color:var(--warn);font-weight:600}
textarea#copyBox{width:100%;height:120px;margin-top:10px;font-family:var(--f-mono);font-size:12px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);padding:8px}

/* settings */
.fzrow{display:grid;grid-template-columns:1fr 64px 64px auto;gap:8px;align-items:end;padding-block:10px;border-bottom:1px solid var(--line)}
.fzrow:last-child{border-bottom:0}
.check{grid-column:1/-1;display:flex;align-items:center;gap:10px;font-weight:600;min-height:40px}
.check input{width:22px;height:22px;accent-color:var(--accent)}
.fzrow .f input{min-height:46px;font-size:16px}
.fzrow .btn{min-height:46px;padding:0 12px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--cell);border-radius:99px;padding:6px 6px 6px 12px;font-weight:600}
.pill button{border:0;background:var(--surface);border-radius:99px;width:30px;height:30px;font-size:16px;line-height:1}

/* bottom sheet */
.backdrop{position:fixed;inset:0;background:rgba(5,12,20,.5);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;display:flex;flex-direction:column;max-height:calc(100% - env(safe-area-inset-top,0px) - 20px);background:var(--bg);border-radius:16px 16px 0 0;max-width:760px;margin:0 auto;box-shadow:0 -8px 30px rgba(0,0,0,.25);overflow:hidden}
.sh-head{flex:none;position:relative;display:flex;align-items:center;gap:10px;padding:18px 12px 10px 16px;border-bottom:1px solid var(--line)}
.sh-head .grab{position:absolute;top:6px;left:50%;transform:translateX(-50%);width:44px;height:5px;border-radius:5px;background:var(--line)}
.sh-title{flex:1;min-width:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sh-title .rack{font-family:var(--f-mono);font-weight:600;font-size:20px;background:var(--ticket);color:var(--ticket-ink);border-radius:6px;padding:3px 8px}
.sh-title .loc{font-family:var(--f-display);font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:.02em}
.sh-title .loc b{font-family:var(--f-mono);background:var(--accent);color:var(--accent-ink);border-radius:5px;padding:0 6px;margin-left:4px}
.sheet .x{flex:none;border:0;background:var(--surface);border-radius:99px;width:40px;height:40px;font-size:20px}
.sh-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:12px 16px 18px}
.sh-body>:first-child{margin-top:0}
.sh-foot{flex:none;border-top:1px solid var(--line);background:var(--surface);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px))}
.sh-foot .row{margin:0}
.abar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.abtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:58px;border-radius:12px;border:0;background:none;font-size:12.5px;font-weight:600;color:var(--ink);padding:4px 2px;text-align:center;line-height:1.15}
.abtn svg{flex:none}
.abtn.pri{background:var(--accent);color:var(--accent-ink)}
.abtn[aria-expanded="true"]{background:var(--cell)}
.abtn:disabled{color:var(--hold);cursor:not-allowed}
.more{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.more .btn{min-height:48px}
@media (min-width:700px){
  .sheet{top:50%;bottom:auto;left:50%;right:auto;width:min(620px,calc(100% - 48px));max-height:88vh;transform:translate(-50%,-50%);border-radius:16px;margin:0}
  .sh-head{padding-top:12px}.sh-head .grab{display:none}
  .sh-foot{padding-bottom:10px}
}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{border:0;background:none;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
nav.tabs button[aria-current="true"]{color:var(--accent)}
nav.tabs button.add[aria-current="true"] span.ic,nav.tabs button.add span.ic{background:var(--accent);color:var(--accent-ink);border-radius:99px;width:38px;height:30px;display:grid;place-items:center}

.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:99px;font-weight:600;max-width:calc(100% - 32px);text-align:center}
@media (max-width:420px){.form{grid-template-columns:1fr 1fr}.tg{grid-template-columns:repeat(2,1fr)}.tg .wide{grid-column:auto}.fzrow{grid-template-columns:1fr 56px 56px}.fzrow .btn{grid-column:1/-1}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{translate:0 24px;opacity:.6}}}
</style>
<style>
.sub{font-weight:500;text-transform:none;letter-spacing:0;opacity:.8}
.tag.hold{background:var(--hold);color:var(--surface)}
.tag.warnt{background:var(--amber);color:var(--surface)}
.holdbar{background:var(--hold);color:var(--surface);border-radius:var(--r);padding:10px 12px;font-weight:700;margin:12px 0 4px}
.cell.hold{box-shadow:inset 0 0 0 3px var(--hold)}
.note{margin:12px 0 4px;background:var(--surface);border:1.5px dashed var(--amber);border-radius:var(--r);padding:8px 12px;white-space:pre-wrap;overflow-wrap:anywhere}
.note label{display:block;font-family:var(--f-display);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--amber)}
.item small.nt{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
textarea.ta{width:100%;min-height:84px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--surface);padding:10px 12px;font-size:17px;font-family:var(--f-body);color:var(--ink)}
.reqlist{display:grid;gap:10px;margin-top:14px}
.req{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:8px}
.req.done{opacity:.6}
.req .rh{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.req .rh>div:first-child{min-width:0}
.req .q{font-family:var(--f-mono);font-weight:600;font-size:22px;overflow-wrap:anywhere}
.req .rb{display:flex;gap:6px;flex:none}
.req .rb .btn{min-height:44px;padding:0 12px}
.match{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;width:100%;text-align:left;border:0;border-top:1px dashed var(--line);background:none;padding:10px 0 2px;font-size:15px}
.match .mf{font-family:var(--f-display);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent)}
.match .mt{text-align:right;font-size:15px}
nav.tabs button{position:relative}
.bdg{position:absolute;top:6px;left:calc(50% + 8px);min-width:20px;height:20px;border-radius:99px;background:var(--warn);color:var(--surface);font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 5px}
/* iPhone: date/time boxes have a built-in minimum width that spills out of their column */
.f input[type="date"],.f input[type="time"]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;width:100%;text-align:left}
.f input::-webkit-date-and-time-value{text-align:left;margin:0}

<div class="app">
  <header class="top">

  <section id="v-inv">

      <div class="f" id="w-fCode"><label for="fCode">Product code</label><input id="fCode" class="big" inputmode="numeric" autocomplete="off" placeholder="1234"></div>
      <div class="f" id="w-fCart"><label for="fCart">RTE Cart #</label><input id="fCart" class="big" autocomplete="off" placeholder="19-20"><span class="err" id="dupWarn" style="color:var(--amber)" hidden></span></div>

      <div class="f"><label for="fDate">Date</label><input id="fDate" type="date"></div>
      <div class="f full"><label>From</label><div class="chips" id="fromChips"></div></div>
      <div class="f"><label for="fPacked">Packed time <span class="sub" data-t="packedHelp"></span></label><input id="fPacked" type="time"></div>
    </div>
    <div class="part"><span class="pn">2</span><div><b data-t="part2"></b><small data-t="part2s"></small></div></div>
    <div class="form">
      <div class="f full"><label data-t="where"></label><div id="pickNew"></div></div>
      <div class="f" id="w-fTemp"><label for="fTemp" data-t="lblTempOpt"></label><input id="fTemp" class="big" inputmode="decimal" autocomplete="off" placeholder="—"><span class="err" id="tempWarn" data-t="hot80" hidden></span></div>

      <div class="f full"><label for="fNote" data-t="noteLbl"></label><textarea id="fNote" class="ta" data-tp="notePh"></textarea></div>

    <div class="row" style="margin-top:18px">
      <button class="btn" type="button" data-act="cancelEdit" id="cancelEdit" data-t="cancel" hidden></button>
      <button class="btn primary" type="button" data-act="save" id="saveBtn"></button>
    </div>
  </section>

  <section id="v-req" hidden>
    <h2 data-t="reqTitle"></h2>
    <p class="hint" data-t="reqHint"></p>

    <div id="reqBody" class="reqlist"></div>

  <section id="v-sheet" hidden>

    <p class="hint" data-t="sheetHint"></p>

    <div id="sheetBody"></div>

  <section id="v-cfg" hidden>

const DEFAULT_CFG={shift:'2do turno',
  freezers:[{id:'blast',name:'Blast Freezer',rows:2,cols:10,aisle:true},{id:'nuevo',name:'Freezer nuevo',rows:4,cols:8,aisle:false},{id:'trailer',name:'Trailer freezer',rows:2,cols:10,aisle:false}],
  dests:['Packing','Kitchen','Otro departamento'],froms:['Kitchen','Spiral Oven'],readyTemp:'35',dayStart:'06:00',keepDays:'60'};
function normCfg(c){
  c=c&&typeof c==='object'?clone(c):{};
  const d=DEFAULT_CFG;
  return {shift:typeof c.shift==='string'?c.shift:d.shift,
    freezers:Array.isArray(c.freezers)&&c.freezers.length?c.freezers.map(f=>({id:String(f.id||newId()),name:String(f.name||'Freezer'),rows:clampN(f.rows,1,26,4),cols:clampN(f.cols,1,30,6),aisle:!!f.aisle})):clone(d.freezers),
    dests:Array.isArray(c.dests)?c.dests.map(String):clone(d.dests),
    froms:Array.isArray(c.froms)?c.froms.map(String):clone(d.froms),readyTemp:c.readyTemp==null?d.readyTemp:String(c.readyTemp),dayStart:/^\d\d:\d\d$/.test(c.dayStart||'')?c.dayStart:d.dayStart,keepDays:c.keepDays==null?d.keepDays:String(c.keepDays)};
}
function clampN(v,a,b,def){v=parseInt(v,10);return isNaN(v)?def:Math.min(b,Math.max(a,v))}

function saveLocal(){const ok=LS.set('mc_carts',carts)&LS.set('mc_cfg',cfg)&LS.set('mc_pending',pending)&LS.set('mc_picks',picks);if(!ok&&Date.now()-fullWarned>60000){fullWarned=Date.now();toast(t('storeFull'))}}
let fullWarned=0;
function queue(path,op){if(dbState!=='local')pending[path]=op}
function putPicks(){queue('picks/main',{op:'set',data:clone(picks)});saveLocal();renderAll();flush()}
function putCart(c){c.upd=Date.now();carts[c.id]=c;queue('carts/'+c.id,{op:'set',data:clone(c)});saveLocal();renderAll();flush()}
function removeCart(id){delete carts[id];queue('carts/'+id,{op:'delete'});saveLocal();renderAll();flush()}
function putCfg(){queue('config/main',{op:'set',data:clone(cfg)});saveLocal();renderAll();flush()}

/* ---------- sync ---------- */
let flushing=false;
async function flush(){
  if(!db||flushing) return; flushing=true;
  try{
    for(const path of Object.keys(pending)){
      const p=pending[path];
      try{
        if(p.op==='set') await db.doc(path).set(p.data); else await db.doc(path).delete();
        if(pending[path]===p) delete pending[path];
        saveLocal(); dbState='online';
      }catch(e){
        const code=e&&e.code;
        if(code==='invalid_argument'||code==='transform_error'){delete pending[path];saveLocal();toast(t('errUpload'))}
        else if(code==='quota_exceeded'){toast(t('errQuota'));break}
        else if(code==='revoked'||code==='not_granted'||code==='capability_disabled'||code==='capability_removed'){db=null;dbState='local';break}
        else {dbState='offline';break}
      }
    }
  } finally {flushing=false;renderSync()}
}
setInterval(()=>{if(db&&Object.keys(pending).length) flush()},20000);
window.addEventListener('online',()=>flush());

function goLocal(){dbState='local';pending={};prune();saveLocal();renderAll()}
const QUOTA=2500000; // characters; Safari keeps roughly this much per site
function storeUsed(){try{let n=0;for(const k of ['mc_carts','mc_cfg','mc_pending','mc_picks','mc_last'])n+=(localStorage.getItem(k)||'').length;return n}catch(e){return 0}}
function prune(){
  if(dbState!=='local')return 0;
  const days=parseInt(cfg.keepDays,10); if(!(days>0))return 0;
  const cut=Date.now()-days*864e5; let n=0;
  for(const id in carts){const c=carts[id];if(c.status!=='in'&&c.outAt&&c.outAt<cut){delete carts[id];n++}}
  const before=(picks.items||[]).length; picks.items=(picks.items||[]).filter(x=>!x.done||x.at>=cut);
  if(n||picks.items.length!==before)saveLocal();
  return n;
}
setInterval(()=>{if(prune())renderAll()},6*3600000);
function connect(){
  const cl=window.claude;
  if(!cl||typeof cl.use!=='function'){goLocal();return}
  cl.use('downloads').then(ns=>{dlNS=ns;if(view==='sheet')renderSheet()}).catch(()=>{});
  cl.use('db').then(ns=>{
    if(!ns){goLocal();return}
    db=ns; dbState='online';
    db.collection('carts').onSnapshot(snap=>{
      const server={}; snap.docs.forEach(d=>{server[d.id]=d.data()});
      const next={};
      for(const id in server){const p=pending['carts/'+id]; if(p){if(p.op==='set'&&carts[id]) next[id]=carts[id]} else next[id]=clone(server[id])}
      for(const id in carts){ if(next[id]) continue; const p=pending['carts/'+id];
        if((p&&p.op==='set')||snap.metadata.fromCache) next[id]=carts[id]; }
      carts=next; saveLocal(); renderAll();
    },()=>{dbState='offline';renderSync()});
    db.doc('picks/main').onSnapshot(s=>{
      if(pending['picks/main']) return;
      if(s.exists){const d=s.data();picks={items:Array.isArray(d.items)?clone(d.items):[]};saveLocal();renderAll()}
      else if(!s.metadata.fromCache&&picks.items.length){pending['picks/main']={op:'set',data:clone(picks)};saveLocal();flush()}
    },()=>{});
    db.doc('config/main').onSnapshot(s=>{
      if(pending['config/main']) return;
      if(s.exists){cfg=normCfg(s.data());fixForm();saveLocal();renderAll()}
      else if(!s.metadata.fromCache){pending['config/main']={op:'set',data:clone(cfg)};saveLocal();flush()}
    },()=>{});
    flush(); renderSync();
  }).catch(()=>{dbState='local';renderSync()});
}

function renderSync(){
  const el=$('#sync'), n=Object.keys(pending).length;
  let cls='',txt=t('connecting');
  if(dbState==='local'){txt=t('savedLocal');cls='ok'}
  else if(dbState==='connecting'){txt=t('connecting')}
  else if(n){txt=t('pendingN',n);cls='pend'}
  else {txt=t('saved');cls='ok'}
  el.className='sync '+cls; el.querySelector('span').textContent=txt;
}

/* ---------- helpers ---------- */
const pad=n=>String(n).padStart(2,'0');
const dayKey=ms=>{const d=new Date(ms);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const todayKey=()=>dayKey(Date.now());
function workDay(ms){const d=new Date(ms);const [H,M]=(cfg.dayStart||'06:00').split(':').map(Number);if(d.getHours()*60+d.getMinutes()<H*60+M)d.setDate(d.getDate()-1);return dayKey(d.getTime())}
const sheetTime=(ms,d)=>ms?fmtTime(ms)+(dayKey(ms)!==d?' ('+fmtDate(dayKey(ms)).slice(0,5)+')':''):'';
const fmtTime=ms=>ms?new Date(ms).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}):'';
const hhmm=ms=>{const d=new Date(ms);return pad(d.getHours())+':'+pad(d.getMinutes())};
function fmt12(s){if(!s||!/^\d\d:\d\d/.test(s))return s||'';let [h,m]=s.split(':').map(Number);const ap=h>=12?'PM':'AM';h=h%12||12;return h+':'+pad(m)+' '+ap}
function fmtDate(s){if(!s)return '';const [y,m,d]=s.split('-');return m+'/'+d+'/'+y.slice(2)}
const fzById=id=>cfg.freezers.find(f=>f.id===id);
const fzName=(id,en)=>{const f=fzById(id);return f?f.name:(id?(en?'Deleted freezer':t('deletedFz')):'—')};
const spotLbl=(r,c)=>String.fromCharCode(65+r)+(c+1);
const isHot=v=>{const n=parseFloat(v);return !isNaN(n)&&n>=80};
function readings(c){return (c.temp?[{t:c.tempAt||c.inAt,temp:c.temp,entry:true}]:[]).concat(c.temps||[]).sort((a,b)=>a.t-b.t)}
function lastT(c){const r=readings(c);return r.length?r[r.length-1]:null}
function ago(ms){const m=Math.max(0,Math.round((Date.now()-ms)/60000));if(m<1)return t('justNow');if(m<60)return t('minAgo',m);const h=Math.floor(m/60);if(h<24)return t('hAgo',h,m%60);return t('dAgo',Math.floor(h/24))}
const readyLim=()=>parseFloat(cfg.readyTemp);
const belowLim=v=>{const lim=readyLim(),n=parseFloat(v);return !isNaN(lim)&&!isNaN(n)&&n<lim};
function isReady(c){const l=lastT(c);return !!l&&belowLim(l.temp)}
function occupancy(fz,exclude){const m={};Object.values(carts).forEach(c=>{if(c.status==='in'&&c.fz===fz&&c.spot&&c.id!==exclude)(m[c.spot]=m[c.spot]||[]).push(c)});return m}
function fixForm(){if(!fzById(form.fz)){form.fz=cfg.freezers[0].id;form.spot=''} if(invFz&&invFz!=='__hold'&&!fzById(invFz)) invFz=''}

/* ---------- position picker ---------- */
function picker(ctx,fz,spot,exclude){
  const f=fzById(fz)||cfg.freezers[0];
  let h='<div class="chips">'+cfg.freezers.map(x=>`<button type="button" class="chip" data-act="pickfz" data-ctx="${ctx}" data-id="${esc(x.id)}" aria-pressed="${x.id===f.id}">${esc(x.name)}</button>`).join('')+'</div>';
  h+=gridHTML(f,spot,exclude,'pick',ctx);
  h+=`<div class="maplegend"><span>${esc(t('tapPick'))}</span><span>${spot?esc(t('posLbl'))+' <b class="mono">'+esc(spot)+'</b>':esc(t('noPos'))}</span></div>`;
  return h;
}
function gridHTML(f,sel,exclude,act,ctx){
  const occ=occupancy(f.id,exclude);
  let h=`<div class="mapwrap"><div class="map" style="grid-template-columns:repeat(${f.cols},minmax(64px,1fr))">`;
  const mid=f.aisle&&f.rows>=2?Math.ceil(f.rows/2):-1;
  for(let r=0;r<f.rows;r++){
   if(r===mid) h+=`<div class="aisle">${esc(t('aisle'))}</div>`;
   for(let c=0;c<f.cols;c++){
    const s=spotLbl(r,c), o=(occ[s]||[]).slice().sort((a,b)=>b.inAt-a.inAt);
    const who=o.map((x,k)=>o.length>1&&k===0?`<span class="front">${esc(x.cart)}</span>`:esc(x.cart)).join('<br>');
    h+=`<button type="button" class="cell${o.length?' busy':''}${o.some(x=>x.hold)?' hold':''}${sel===s?' sel':''}" data-act="${act}" data-ctx="${ctx||''}" data-spot="${s}" aria-label="${esc(t('spotAria',s,o.length))}"><span class="lab">${s}</span><span class="who">${who}</span></button>`;
   }
  }
  h+='</div></div>';
  if(Object.values(occ).some(o=>o.length>1)) h+=`<div class="maplegend"><span>${t('frontLegend')}</span></div>`;
  return h;
}

  return `<button type="button" class="item${out?' out':''}" data-act="open" data-id="${esc(c.id)}">
    <span class="rack">${esc(c.cart||'?')}</span>

      <small class="cc">CCP2 # <b class="mono">${esc(c.ccp2||'—')}</b></small>

    <span class="loc">${loc}</span></button>`;

function renderInv(){
  const all=Object.values(carts), body=$('#invBody');
  if(!all.length){
    body.innerHTML=`<div class="empty"><h2>${esc(t('emptyTitle'))}</h2><p class="hint">${t('emptyText')}</p>
      <div class="row"><button class="btn primary" type="button" data-act="tab" data-v="new">${esc(t('firstCart'))}</button><button class="btn" type="button" data-act="demo">${esc(t('seeDemo'))}</button></div></div>`;
    return;
  }
  const inC=all.filter(c=>c.status==='in');
  const q=$('#q').value.trim().toLowerCase();
  let h='';
  if(q){
    const score=c=>cartTokens(c.cart).includes(q)||String(c.cart||'').toLowerCase()===q?0:String(c.code||'').toLowerCase()===q?1:String(c.lot||'').toLowerCase()===q?2:3;
    const hits=all.filter(c=>[c.code,c.lot,c.cart,c.ccp2].some(v=>String(v||'').toLowerCase().includes(q)))
      .sort((a,b)=>(a.status==='in'?0:1)-(b.status==='in'?0:1)||score(a)-score(b)||b.inAt-a.inAt);
    h+=`<h3>${esc(t('results',hits.length))}</h3>`;
    h+=hits.length?'<div class="list">'+hits.slice(0,60).map(itemHTML).join('')+'</div>':`<p class="hint">${esc(t('noHits'))}</p>`;
    body.innerHTML=h; return;
  }
  h+='<div class="chips" style="margin-top:12px">'+`<button type="button" class="chip" data-act="fz" data-id="" aria-pressed="${!invFz}">${esc(t('all'))} <b>${inC.length}</b></button>`+
     cfg.freezers.map(f=>`<button type="button" class="chip" data-act="fz" data-id="${esc(f.id)}" aria-pressed="${invFz===f.id}">${esc(f.name)} <b>${inC.filter(c=>c.fz===f.id).length}</b></button>`).join('')+
     (inC.some(c=>c.hold)||invFz==='__hold'?`<button type="button" class="chip" data-act="fz" data-id="__hold" aria-pressed="${invFz==='__hold'}">${esc(t('heldChip'))} <b>${inC.filter(c=>c.hold).length}</b></button>`:'')+'</div>';
  let list;
  if(invFz==='__hold'){list=inC.filter(c=>c.hold)}
  else if(invFz){
    const f=fzById(invFz);
    const occ=occupancy(f.id);
    h+=`<h3>${esc(t('occupied',f.name,Object.keys(occ).length,f.rows*f.cols))}</h3>`;
    h+=gridHTML(f,spotFilter,null,'cell');
    h+=`<div class="maplegend"><span>${esc(t('tapSpot'))}</span>${spotFilter?`<button class="chip" type="button" data-act="cell" data-spot="${esc(spotFilter)}" aria-pressed="true">${esc(t('spot',spotFilter))} ✕</button>`:''}</div>`;
    list=inC.filter(c=>c.fz===f.id&&(!spotFilter||c.spot===spotFilter));
  } else list=inC;
  list.sort((a,b)=>b.inAt-a.inAt);

function loadLib(k){return libP[k]||(libP[k]=LIBS[k].reduce((p,src)=>p.then(()=>loadScript(src)),Promise.resolve()).catch(e=>{delete libP[k];throw e}))}
const libReady=k=>k==='xlsx'?!!window.XLSX:!!(window.jspdf&&window.jspdf.jsPDF&&window.jspdf.jsPDF.API&&window.jspdf.jsPDF.API.autoTable);
const fileBase=()=>'RTE-freezer-log-'+($('#sDate').value||workDay(Date.now()));
function csvBlob(){
  const csv='﻿'+tableData().map(r=>r.map(v=>{v=String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')).join('\r\n');
  return new Blob([csv],{type:'text/csv;charset=utf-8'});
}
function xlsxBlob(){
  const data=tableData(), head=data[0];
  const numIdx=head.map((h,i)=>/Temp \(°F\)$/.test(h)||h==='#'?i:-1).filter(i=>i>=0);
  const aoa=data.map((r,ri)=>ri===0?r:r.map((v,i)=>numIdx.includes(i)&&v!==''&&!isNaN(Number(v))?Number(v):v));
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols']=head.map((h,i)=>({wch:Math.max(6,Math.min(30,Math.max(h.length,...aoa.slice(1).map(r=>String(r[i]).length))+2))}));
  ws['!autofilter']={ref:ws['!ref']};
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'RTE Log');
  return new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
function pdfBlob(){
  const {jsPDF}=window.jspdf, doc=new jsPDF({orientation:'landscape',unit:'pt',format:'letter'});
  const d=$('#sDate').value||workDay(Date.now()), shift=$('#sShift').value, rows=sheetRows();
  const cols=COLS.filter(c=>c[0]!=='Logged At');
  const hotIdx=cols.findIndex(c=>c[0]==='First Temp (°F)');
  doc.setFont('helvetica','bold');doc.setFontSize(15);doc.text('RTE Freezer Log',24,32);
  doc.setFont('helvetica','normal');doc.setFontSize(9);
  doc.text('Date: '+fmtDate(d)+'     Shift: '+(shift||'All')+'     Carts: '+rows.length+'     Generated: '+new Date().toLocaleString('en-US',{month:'2-digit',day:'2-digit',year:'2-digit',hour:'numeric',minute:'2-digit'}),24,48);
  doc.autoTable({head:[cols.map(c=>c[0])],body:rows.map((r,i)=>cols.map(c=>String(c[1](r,i,d)))),startY:58,margin:{left:24,right:24,bottom:30},
    styles:{font:'helvetica',fontSize:6.5,cellPadding:2.5,overflow:'linebreak',lineColor:[200,208,216],lineWidth:0.4,textColor:[19,32,43]},
    headStyles:{fillColor:[31,95,191],textColor:255,fontStyle:'bold',valign:'middle'},alternateRowStyles:{fillColor:[243,246,249]},
    didParseCell:h=>{if(h.section==='body'&&h.column.index===hotIdx&&isHot(h.cell.raw))h.cell.styles.textColor=[179,38,30]}});
  const n=doc.getNumberOfPages();
  for(let i=1;i<=n;i++){doc.setPage(i);doc.setFontSize(8);doc.setTextColor(90,103,117);doc.text('Page '+i+' of '+n,doc.internal.pageSize.getWidth()-24,doc.internal.pageSize.getHeight()-14,{align:'right'})}
  return doc.output('blob');
}
async function deliverFile(name,blob){
  if(standalone&&navigator.canShare){
    const file=new File([blob],name,{type:blob.type});
    if(navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file],title:name});return true}
      catch(e){if(e&&e.name==='AbortError')return false}
    }
  }
  return saveFile(name,blob,blob.type);
}
let exporting=false;
async function doExport(f){
  if(exporting||!canSave())return;
  if(f!=='csv'&&!libReady(f)){
    toast(t('prepping'));
    try{await loadLib(f)}catch(e){toast(t('libFail'));return}
    if(standalone){toast(t('tapAgain'));return}
  }
  exporting=true;
  try{
    const blob=f==='csv'?csvBlob():f==='xlsx'?xlsxBlob():pdfBlob();
    if(await deliverFile(fileBase()+'.'+f,blob)) toast(t('fileReady'));
  }catch(e){toast(t('dlFail'))}
  finally{exporting=false}
}
async function doCsv(){
  if(!canSave()) return;
  const csv='\ufeff'+tableData().map(r=>r.map(v=>{v=String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')).join('\r\n');
  if(await saveFile('RTE-freezer-log-'+($('#sDate').value||workDay(Date.now()))+'.csv',csv,'text/csv;charset=utf-8')) toast(t('fileReady'));
}

/* ---------- requests ---------- */
const FIELD_RANK={'RTE Cart #':0,'Product code':1,'Lot #':2,'CCP2 #':3};
function matchField(c,Q){
  if(cartTokens(c.cart).includes(Q)||String(c.cart||'').toLowerCase()===Q) return 'RTE Cart #';
  if(String(c.code||'').toLowerCase()===Q) return 'Product code';
  if(String(c.lot||'').toLowerCase()===Q) return 'Lot #';
  if(cartTokens(c.ccp2).includes(Q)||String(c.ccp2||'').toLowerCase()===Q) return 'CCP2 #';
  return '';
}
const inRange=(c,r)=>cartTokens(c.cart).some(tk=>/^\d+$/.test(tk)&&+tk>=r[0]&&+tk<=r[1]);
function reqMatches(x){
  const code=String(x.code||'').toLowerCase();
  const all=Object.values(carts).filter(c=>!code||String(c.code||'').toLowerCase()===code);
  let m;
  if(x.range) m=all.filter(c=>inRange(c,x.range)).map(c=>({c,f:'RTE Cart #'}));
  else{
    const Q=String(x.q).toLowerCase();
    m=all.map(c=>({c,f:matchField(c,Q)})).filter(y=>y.f);
    if(!m.length) m=all.filter(c=>[c.cart,c.code,c.lot].some(v=>String(v||'').toLowerCase().includes(Q))).map(c=>({c,f:''}));
  }
  m.sort((a,b)=>(FIELD_RANK[a.f]??9)-(FIELD_RANK[b.f]??9)||(x.range?(parseInt(cartTokens(a.c.cart)[0])||0)-(parseInt(cartTokens(b.c.cart)[0])||0):b.c.inAt-a.c.inAt));
  const lim=x.range?40:8;
  return m.filter(y=>y.c.status==='in').concat(m.filter(y=>y.c.status!=='in').slice(0,2)).slice(0,lim);
}
function rangeMissing(x){
  const code=String(x.code||'').toLowerCase(), have=new Set();
  Object.values(carts).forEach(c=>{if(c.status==='in'&&(!code||String(c.code||'').toLowerCase()===code))cartTokens(c.cart).forEach(tk=>{if(/^\d+$/.test(tk))have.add(+tk)})});
  const miss=[];for(let n=x.range[0];n<=x.range[1];n++)if(!have.has(n))miss.push(n);
  return miss;
}
function reqHTML(x){
  const list=reqMatches(x);
  const title=x.range?t('reqRange',x.range[0],x.range[1]):x.q;
  let h=`<div class="req${x.done?' done':''}"><div class="rh"><div><div class="q">${esc(title)}</div><small class="hint">${x.code?esc(t('codeOnly',x.code))+' · ':''}${x.note?esc(x.note)+' · ':''}${esc(t('reqAsked',ago(x.at)))}</small></div>
    <div class="rb"><button class="btn" type="button" data-act="reqDone" data-id="${esc(x.id)}">${esc(t(x.done?'reqUndo':'reqDone'))}</button><button class="btn" type="button" data-act="reqDel" data-id="${esc(x.id)}" aria-label="${esc(t('reqRemove',x.q))}">✕</button></div></div>`;
  if(x.range){const miss=rangeMissing(x);h+=`<p class="hint" style="margin:0;font-weight:600;color:${miss.length?'var(--amber)':'var(--ok)'}">${esc(miss.length?t('reqMissing',miss.join(', ')):t('reqAllFound',x.range[0]+'–'+x.range[1]))}</p>`}
  else if(!list.length) h+=`<p class="hint" style="margin:0">${esc(t('reqNone'))}</p>`;
  h+=list.map(({c,f})=>{
    const l=lastT(c), fresh=!!l&&l.t>=x.at, inF=c.status==='in';
    const where=inF?`<b>${esc(fzName(c.fz))}${c.spot?' · '+esc(c.spot):''}</b>`:esc(t('deliveredTo')+' '+(c.dest||'—'));
    return `<button type="button" class="match" data-act="open" data-id="${esc(c.id)}">
      <span>${f?`<span class="mf">${esc(t('matchAs',f))}</span><br>`:''}RTE Cart # <b class="mono">${esc(c.cart)}</b> · <b class="k-code">COD ${esc(c.code)}</b> · <span class="k-lot">${esc(t('lot'))} <b>${esc(c.lot||'—')}</b></span> · <span class="k-ccp">CCP2 # <b>${esc(c.ccp2||'—')}</b></span>${inF&&c.hold?` <span class="tag hold">${esc(t('holdTag'))}</span>`:''}${inF&&isReady(c)?` <span class="tag ready">${esc(t('ready'))}</span>`:''}<br>${where}</span>
      <span class="mt">${l?`<b class="mono">${esc(l.temp)}°F</b><br><small>${esc(ago(l.t))}</small>`:`<small>${esc(t('noTemp'))}</small>`}${inF?`<br><span class="tag ${fresh?'ready':'warnt'}">${esc(t(fresh?'freshTemp':'needTemp'))}</span>`:''}</span></button>`}).join('');
  return h+'</div>';
}
function renderReq(){
  const items=picks.items||[];
  const open=items.filter(x=>!x.done).sort((a,b)=>b.at-a.at), done=items.filter(x=>x.done).sort((a,b)=>b.at-a.at);
  let h='';
  if(!items.length) h=`<div class="empty" style="margin-top:0"><p class="hint" style="margin:0">${esc(t('reqEmpty'))}</p></div>`;
  h+=open.map(reqHTML).join('');
  if(done.length) h+=`<h3>${esc(t('reqDoneTitle',done.length))}</h3>`+done.map(reqHTML).join('')+`<button class="btn block" type="button" data-act="reqClear">${esc(t('reqClearDone'))}</button>`;
  $('#reqBody').innerHTML=h;
}

/* ---------- views ---------- */
function setView(v){
  view=v;LS.set('mc_view',v);
  ['inv','new','req','sheet','cfg'].forEach(k=>{$('#v-'+k).hidden=k!==v});
  document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-current',String(b.dataset.v===v)));
  renderAll();window.scrollTo({top:0});
}
function renderAll(){
  $('#shiftLbl').textContent=cfg.shift||t('noShift');
  if(view==='inv')renderInv();
  else if(view==='new')renderForm();
  else if(view==='req')renderReq();
  else if(view==='sheet')renderSheet();
  else if(view==='cfg')renderCfg();
  renderSheetLayer();renderSync();renderBadge();
}

    picks.items=(picks.items||[]).concat(qs.map((q,k)=>{const m=q.match(/^(\d+)-(\d+)$/),it={id:newId()+k,q,note,at:now,done:false};
      if(q===code)return it;
      if(code)it.code=code;
      if(m&&+m[1]<+m[2]&&+m[2]-+m[1]<=60)it.range=[+m[1],+m[2]];
      return it}));
    while(picks.items.length>150){const i=picks.items.findIndex(x=>x.done);if(i<0)break;picks.items.splice(i,1)}
    $('#rq').value='';$('#rqCode').value='';putPicks();toast(t('reqAdded',qs.length))},
  reqDone:b=>{const x=picks.items.find(i=>i.id===b.dataset.id);if(!x)return;x.done=!x.done;putPicks()},
  reqDel:b=>{picks.items=picks.items.filter(i=>i.id!==b.dataset.id);putPicks()},
  reqClear:()=>{picks.items=picks.items.filter(i=>!i.done);putPicks()},
  sOut:()=>{Object.assign(sheet,{mode:'out',dest:'',temp:'',err:false,time:hhmm(Date.now())});renderSheetLayer()},
  sDest:b=>{sheet.dest=b.dataset.v;renderSheetLayer()},
  sOutOk:()=>{if(!sheet.dest||carts[sheet.id].hold)return;
    const temp=(sheet.temp||'').trim();
    if(!temp||isNaN(parseFloat(temp))){sheet.err=true;renderSheetLayer();const i=$('#sOutTemp');if(i)i.focus();return}
    const c=clone(carts[sheet.id]);const d=new Date();
    if(/^\d\d:\d\d/.test(sheet.time||'')){const [H,M]=sheet.time.split(':').map(Number);d.setHours(H,M,0,0);if(d.getTime()>Date.now()+60000)d.setDate(d.getDate()-1)}
    c.status='out';c.outAt=d.getTime();c.dest=sheet.dest;c.outTemp=temp;
    (c.log=c.log||[]).push({t:c.outAt,a:'out',dest:c.dest,temp});
    closeSheet();putCart(c);toast(t('deliveredToast',c.cart,c.dest,temp))},
  sUndo:()=>{const c=clone(carts[sheet.id]);c.status='in';c.outAt=0;c.dest='';c.outTemp='';(c.log=c.log||[]).push({t:Date.now(),a:'undo'});putCart(c);toast(t('undone'))},
  sEdit:()=>startEdit(sheet.id),
  sTemp:()=>{Object.assign(sheet,{mode:'temp',temp:'',err:false,time:hhmm(Date.now())});renderSheetLayer();const i=$('#sTempV');if(i)i.focus()},
  sTempOk:()=>{const temp=(sheet.temp||'').trim();
    if(!temp||isNaN(parseFloat(temp))){sheet.err=true;renderSheetLayer();return}
    const c=clone(carts[sheet.id]);const d=new Date();
    if(/^\d\d:\d\d/.test(sheet.time||'')){const [H,M]=sheet.time.split(':').map(Number);d.setHours(H,M,0,0);if(d.getTime()>Date.now()+60000)d.setDate(d.getDate()-1)}
    (c.temps=c.temps||[]).push({t:d.getTime(),temp});(c.log=c.log||[]).push({t:d.getTime(),a:'temp',temp});
    sheet.mode='view';putCart(c);toast(t('tempSaved',c.cart,temp))},
  sDel:()=>{sheet.mode='del';renderSheetLayer()},
  sDelOk:()=>{const id=sheet.id;closeSheet();removeCart(id);toast(t('deleted'))},
  copy:()=>doCopy(), csv:()=>doCsv(), exp:b=>doExport(b.dataset.f),
  bkSave:async()=>{const data=JSON.stringify({app:'freezer-rte',v:1,exportedAt:new Date().toISOString(),carts,cfg,picks});
    if(await saveFile('freezer-rte-backup-'+todayKey()+'.json',data,'application/json')) toast(t('bkSaved'))},
  bkCancel:()=>{bkPending=null;renderCfg()},
  bkApply:()=>{const b=bkPending;bkPending=null;if(!b)return;
    Object.keys(carts).forEach(id=>{if(!b.carts[id])queue('carts/'+id,{op:'delete'})});
    carts=clone(b.carts);Object.keys(carts).forEach(id=>{queue('carts/'+id,{op:'set',data:clone(carts[id])})});
    cfg=normCfg(b.cfg);queue('config/main',{op:'set',data:clone(cfg)});
    picks={items:Array.isArray(b.picks&&b.picks.items)?clone(b.picks.items):[]};queue('picks/main',{op:'set',data:clone(picks)});
    fixForm();saveLocal();renderAll();flush();toast(t('bkDone'))},
  demo:()=>loadDemo(),
  clearDemo:()=>{Object.values(carts).filter(c=>c.demo).forEach(c=>{delete carts[c.id];queue('carts/'+c.id,{op:'delete'})});saveLocal();renderAll();flush();toast(t('demoCleared'))},
  addFz:()=>{cfg.freezers.push({id:newId(),name:'Freezer '+(cfg.freezers.length+1),rows:3,cols:6,aisle:false});putCfg()},
  rmFz:b=>{const f=cfg.freezers[+b.dataset.i];if(!f||cfg.freezers.length<2)return;cfg.freezers.splice(+b.dataset.i,1);fixForm();putCfg()},
  addItem:b=>{const k=b.dataset.k,inp=$('#add-'+k),v=inp.value.trim();if(!v)return;if(!cfg[k].includes(v))cfg[k].push(v);putCfg()},
  rmItem:b=>{cfg[b.dataset.k].splice(+b.dataset.i,1);if(b.dataset.k==='froms'&&!cfg.froms.includes(form.from))form.from='';putCfg()}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=A[b.dataset.act];if(f)f(b,e)});
document.addEventListener('change',e=>{
  const el=e.target;
  if(sheet&&(el.id==='sOutTime'||el.id==='sTempT')){sheet.time=el.value;return}
  const k=el.dataset&&el.dataset.cfg; if(!k) return;
  const i=+el.dataset.i;
  if(k==='shift') cfg.shift=el.value.trim();
  else if(k==='fzname') cfg.freezers[i].name=el.value.trim()||'Freezer';
  else if(k==='fzrows') cfg.freezers[i].rows=clampN(el.value,1,26,cfg.freezers[i].rows);
  else if(k==='fzcols') cfg.freezers[i].cols=clampN(el.value,1,30,cfg.freezers[i].cols);
  else if(k==='fzaisle') cfg.freezers[i].aisle=el.checked;
  else if(k==='ready') cfg.readyTemp=el.value.trim();
  else if(k==='keep'){const n=parseInt(el.value,10);cfg.keepDays=n>0?String(Math.min(n,3650)):''}
  else if(k==='day'){if(!/^\d\d:\d\d/.test(el.value))return;cfg.dayStart=el.value.slice(0,5)}
  putCfg();
});
document.addEventListener('input',e=>{
  if(!sheet)return;const id=e.target.id;
  if(id==='sOutTemp'||id==='sTempV'){sheet.temp=e.target.value;if(id==='sOutTemp')refreshOutWarn()}
  else if(id==='sNoteV'||id==='sHoldV')sheet.note=e.target.value;
  else if(id==='sOutTime'||id==='sTempT')sheet.time=e.target.value;
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheet)closeSheet();if(e.key==='Enter'&&(e.target.id==='rq'||e.target.id==='rqNote'||e.target.id==='rqCode')){e.preventDefault();A.reqAdd()}if(e.key==='Enter'&&e.target.id&&e.target.id.startsWith('add-')){const b=e.target.parentNode.querySelector('[data-act="addItem"]');if(b)b.click()}});
setInterval(()=>{if(view==='req'&&!sheet)renderReq();if(view==='inv'&&!sheet)renderInv();if(view==='new'&&!timeTouched)$('#fTime').value=hhmm(Date.now())},60000);
$('#q').addEventListener('input',()=>renderInv());
$('#fTime').addEventListener('input',()=>{timeTouched=true});
$('#fCart').addEventListener('input',dupCheck);
$('#fDate').addEventListener('change',onDateChange);
$('#fTemp').addEventListener('input',()=>{$('#tempWarn').hidden=!isHot($('#fTemp').value)});
$('#sDate').addEventListener('change',()=>{sDateTouched=true;renderSheet()});
document.addEventListener('change',e=>{
  if(e.target.id!=='bkFile'||!e.target.files||!e.target.files[0])return;
  const r=new FileReader();
  r.onload=()=>{try{const b=JSON.parse(r.result);if(!b||b.app!=='freezer-rte'||typeof b.carts!=='object')throw 0;bkPending=b;renderCfg()}catch(err){toast(t('bkBad'))}};
  r.onerror=()=>toast(t('bkBad'));
  r.readAsText(e.target.files[0]);
});
$('#sShift').addEventListener('change',()=>renderSheet());

applyStatic();
fixForm();resetForm(false);
setView(view);
connect();
})();
</script>

<script>
if('serviceWorker' in navigator){addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script>
</body>
</html>
